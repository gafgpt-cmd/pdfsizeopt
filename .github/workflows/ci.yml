name: preservation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lossless:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.8"
      - name: Install build and PDF validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config nasm curl git unzip ca-certificates zlib1g-dev libssl-dev libffi-dev libjpeg-dev libpng-dev libtiff-dev libleptonica-dev libfreetype6-dev libfontconfig1-dev libopenjp2-7-dev liblcms2-dev libbrotli-dev libharfbuzz-dev libcairo2-dev
      - name: Prepare pinned test dependencies
        run: bash extra/setup_fork_tests.sh
      - name: Test source and rebuilt package
        run: bash extra/run_fork_tests.sh
